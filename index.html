<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Lilium - музыкальная шкатулка</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0506;color:#d9c08d;font-family:"Hoefler Text","Baskerville","Palatino Linotype",Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 45%,rgba(5,1,2,.72) 100%)}
#ui{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#hint{font-style:italic;font-size:19px;text-align:center;padding:0 24px;text-shadow:0 1px 8px #000;min-height:1.3em}
#row{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:15px;color:#d9c08d;background:rgba(24,9,10,.72);border:1px solid #7d5f2e;padding:9px 16px;border-radius:2px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
button:hover{background:rgba(64,26,24,.85);color:#f3dfb2}button:focus-visible{outline:2px solid #f3dfb2;outline-offset:2px}
#veil{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#070203;transition:opacity 3s ease}
#veil.off{opacity:0;pointer-events:none}
#veil h1{margin:0;font-family:"Snell Roundhand","Zapfino","Palatino",serif;font-weight:400;font-size:clamp(64px,13vw,132px);line-height:1.25;color:#d9b264}
#veil p{margin:0;font-style:italic;font-size:19px;color:#a48a5c;text-align:center;padding:0 24px}
#veil button{font-size:18px;padding:13px 28px}
#ui{transition:opacity 2s 2.5s;opacity:0;visibility:hidden}body.in #ui{opacity:1;visibility:visible}
